<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="google" content="notranslate"><meta http-equiv="Content-Language" content="pt-BR">
<title>Protótipo Lista de Voos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: lista de voos desktop; coluna de filtros, lista de cards, coluna de anúncios, rodapé. Visual único, claro. */
:root{
  --brand:#4300d2; --brand-d:#3500a8; --band:#230f6e; --field:#463481; --tint:#f3eefe;
  --ink:#323439; --ink2:#565a60; --ink3:#72777f; --line:#dde1e8; --bg:#f2f4f5; --pg:#eeeeee; --surf:#fff;
  --green:#0b7a45; --green-bg:#e4f5ec; --teal:#2f7a65; --warn:#b3261e; --red:#e5190a; --amber:#b86e00;
  --f:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;font-weight:500}
a{color:var(--brand)}
svg{display:block;flex:none}
input,select{font-family:inherit}
.scroller{overflow-x:auto;width:100%}
.app{min-width:1280px;max-width:1440px;margin:0 auto;position:relative}
:focus-visible{outline:2px solid #8f6bff;outline-offset:2px}
.progress{position:fixed;left:0;right:0;top:0;height:3px;z-index:200;pointer-events:none}
.progress i{display:block;height:100%;width:0;background:#8f6bff;transition:width .6s ease,opacity .3s}

/* top bar */
.topbar{background:var(--band);color:#fff;height:60px;display:flex;align-items:center;gap:8px;padding:0 52px 0 52px}
.logo{display:flex;align-items:center;gap:8px;font-weight:500;font-size:26px;letter-spacing:-.5px;color:#fff;text-decoration:none;margin-right:12px}
.logo b{width:28px;height:28px;border-radius:50%;background:linear-gradient(90deg,#fff 50%,#8a7bd0 50%);display:block}
.sp{flex:1}
.tlink{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:#fff;background:none;border:0;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none}
.tlink:hover{background:rgba(255,255,255,.1)}
.tlink.tel{background:#eee9ff;color:var(--ink);padding:8px 12px;border-radius:6px;font-weight:500;font-size:13px}
.tlink.tel:hover{background:#fff}
.tlink.lgt{font-weight:500}
.prodbtn{display:flex;align-items:center;gap:10px;padding:0 12px 0 10px;height:36px;border-radius:8px;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:500;font-size:13px}
.prodbtn:hover{background:rgba(255,255,255,.2)}
.prodbtn[aria-expanded=true]{background:rgba(255,255,255,.28)}
.prodbtn[aria-expanded=true] .chev{transform:rotate(180deg)}
.chev{transition:transform .18s}
.cart{position:relative}
.badge{position:absolute;right:2px;top:0;background:#c43c28;color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center}
.vsep{width:1px;height:22px;background:rgba(255,255,255,.35);margin:0 6px}
.flagc{width:22px;height:22px;border-radius:50%;background:#8b8795;display:flex;align-items:center;justify-content:center;color:#fff}

/* product nav */
.pnav{background:var(--band);color:#fff;display:flex;gap:0;padding:0 52px 0 40px;height:100px}
.pnav button{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;width:88px;padding:14px 0 0;font-size:12px;position:relative;font-family:inherit}
.pnav .ic{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;position:relative}
.pnav button.on .ic{background:#fff;color:var(--band)}
.pnav button.on span.lb{border-bottom:2px solid #fff;padding-bottom:1px}
.pnav button:hover .ic{background:rgba(255,255,255,.22)}
.pnav button.on:hover .ic{background:#fff}
.pnav .tg{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#d8f5ea;color:#0a5a3c;border-radius:4px;font-size:10px;padding:1px 6px;font-weight:500;white-space:nowrap}
.pnav .tg.nv{background:#fff;color:#2a2a2a}

/* band (B) */
.band{background:var(--band);padding:20px 52px 24px 52px;color:#fff;position:relative}
.sumrow{display:flex;gap:20px;align-items:stretch}
.sumfield{font-weight:400;flex:1;display:flex;align-items:center;gap:14px;height:50px;padding:0 16px;border-radius:12px;background:var(--field);border:0;color:#fff;font-size:15px;text-align:left}
.sumfield:hover{background:#503e90}
.sumfield .dot{opacity:.7}
.sumfield .grow{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datep{display:flex;align-items:center;gap:0}
.datep button.arr{width:50px;height:50px;border-radius:12px;border:0;background:var(--field);color:#fff;display:flex;align-items:center;justify-content:center}
.datep button.arr:hover:not(:disabled){background:#503e90}
.datep button:disabled{opacity:.4;cursor:not-allowed}
.datep .dl{width:110px;text-align:center;font-size:15px;white-space:nowrap}
.editrow{display:flex;gap:6px;align-items:flex-start;animation:fi .22s}
.editrow .trip{width:176px;flex:none}

/* search fields (original look) */
.sfield{background:#fff;color:var(--ink);border-radius:8px;border:1px solid #cfd3dc;height:56px;padding:0 12px;display:flex;align-items:center;gap:10px;position:relative;min-width:0;text-align:left}
.sfield .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.sfield small{font-size:11px;color:#6f747c;line-height:1.1}
.sfield input{border:0;padding:0;margin:0;font-size:14px;color:var(--ink);background:none;outline:none;width:100%;text-overflow:ellipsis;line-height:1.3}
.sfield .v{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.sfield:focus-within{outline:2px solid #8f6bff}
.sfield .ico{color:#444;display:flex}
.sfield.btnf{cursor:pointer;font:inherit}
.sfield.btnf:hover{border-color:#8f6bff}
.sfield .dv{width:1px;height:30px;background:#cfd3dc;margin:0 12px}
.sel{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;height:56px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:14px;width:100%;position:relative}
.sel:hover{background:rgba(255,255,255,.2)}
.sel[aria-expanded=true] svg{transform:rotate(180deg)}
.swapb{position:absolute;right:-18px;top:50%;margin-top:-16px;width:32px;height:32px;border-radius:6px;border:1px solid #cfd3dc;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;z-index:3;padding:0}
.swapb:hover{background:var(--bg)}
.btn{height:46px;border-radius:999px;border:0;background:var(--brand);color:#fff;font-weight:500;padding:0 28px;font-size:15px}
.btn:hover{background:var(--brand-d)}
.btn.light{background:#fff;color:var(--brand)}
.btn.light:hover{background:#efeaff}
.btn.red{background:var(--red);color:#fff}
.btn.red:hover{background:#c91409}
.btn.line{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.line:hover{background:var(--tint)}
.btn.sm{height:40px;font-size:14px;padding:0 22px}
.btn.srch{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:500;height:56px;padding:0 24px;min-width:128px}

/* popovers */
.slot{position:absolute;left:0;top:100%;z-index:70}
.slot:empty{display:none}
.pop{background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 8px 30px rgba(20,10,60,.25);border:1px solid #e6e8ee;padding:8px;margin-top:6px;min-width:260px;animation:fi .12s}
.pop.r{right:0}
.pop .sec{font-size:11px;letter-spacing:.08em;font-weight:600;color:#3a3b40;padding:10px 12px 6px;text-transform:uppercase}
.pop button.row{display:flex;width:100%;gap:12px;align-items:center;padding:10px 12px;border:0;background:none;text-align:left;border-radius:8px;font-size:14px;color:var(--ink);font-family:inherit}
.pop button.row:hover,.pop button.row.hl{background:var(--bg)}
.pop button.row .sub{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.pop button.row.ind{padding-left:36px}
.pop .ck3{margin-left:auto;color:var(--ink);display:flex}
.pop .thumb{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,#6a5acd,#2f2a6e);flex:none}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;gap:20px}
.stepper .s{display:flex;align-items:center;gap:12px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--brand);background:#fff;color:var(--brand);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.stepper button:disabled{border-color:var(--line);color:var(--line);cursor:not-allowed}
.cal{display:flex;gap:28px;padding:12px 16px 4px}
.cal .mo{width:272px}
.cal .mh{display:flex;justify-content:center;align-items:center;gap:6px;height:32px;font-weight:500;position:relative}
.cal .mh small{font-weight:400;color:var(--ink3)}
.cal .nav{position:absolute;top:0;width:32px;height:32px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal .nav:hover{background:var(--bg)}
.cal .dw,.cal .dg{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .dw span{font-size:11px;color:#9a9fa9;text-align:center;padding:8px 0}
.cal .dg button{height:38px;border:0;background:none;font-size:14px;position:relative;font-weight:500;color:var(--ink)}
.cal .dg button.out{color:#9a9fa9;font-weight:400}
.cal .dg button.dis{color:#c4c7ce;cursor:not-allowed;font-weight:400}
.cal .dg button.rng{background:#e7e0fb}
.cal .dg button.rng.s{background:linear-gradient(90deg,transparent 50%,#e7e0fb 50%)}
.cal .dg button.rng.e{background:linear-gradient(90deg,#e7e0fb 50%,transparent 50%)}
.cal .dg button span{display:flex;width:36px;height:36px;margin:0 auto;border-radius:50%;align-items:center;justify-content:center}
.cal .dg button:not(.dis):not(.cs):hover span{background:#e4dcfa}
.cal .dg button.cs span{background:#20106b;color:#fff}
.cal .dg button.prev{background:#efeafc}
.cal .dg button.prevend span{background:#cfc3f5}
.calf{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:10px 16px 6px;border-top:1px solid var(--line);margin-top:8px}
.calf .ghost{border:0;background:none;color:#6a6f78;font-weight:500;padding:8px 12px}

/* body layout */
.cols{display:grid;grid-template-columns:264px minmax(0,1fr) 160px;gap:0 24px;padding:20px 48px 40px 40px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.chip-btn{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:500;color:var(--ink);width:100%;text-align:left;position:relative;overflow:hidden}
.chip-btn:hover{border-color:#c6c9d4}
.chip-btn:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#d7ccff,#cfe7ff,#e8d5ff,#d7ccff);filter:blur(5px);opacity:.7}
.chip-btn.alert{justify-content:center;color:var(--brand);height:48px}
.chip-btn.alert:after{display:none}
.chip-btn .grow{flex:1}
.panel{padding:0}
.v-b .panel{background:#fff;border-radius:12px;border:1px solid var(--line);padding:16px}
.sform{background:#2d1790;color:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sform h3{margin:4px 0 6px;font-size:20px;font-weight:500}
.sform .sfield{height:56px}
.sform .row2{display:flex}
.sform .fw{position:relative}
.fw{position:relative;min-width:0}
.sfield.dbl{padding:0;gap:0;width:100%}
.dbl>div{flex:1;padding:0 12px;display:flex;flex-direction:column;min-width:0;text-align:left}
.dbl>.dv{height:56px;margin:0;flex:none}
.slot.r{left:auto;right:0}
.switch{display:flex;align-items:center;gap:10px;font-size:13px;padding:2px 2px;cursor:pointer;width:fit-content}
.switch i{width:34px;height:18px;border-radius:9px;background:#d1d1d6;position:relative;display:block;transition:background .15s}
.switch i:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch.on i{background:#8f6bff}.switch.on i:after{transform:translateX(16px)}
.fh{font-size:16px;font-weight:500;margin:0 0 10px;padding:0 4px}
.fchips{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.fchip{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border:1.5px solid var(--brand);color:var(--brand);background:#fff;border-radius:999px;padding:7px 14px;font-weight:500;font-size:13px}
.fchip:hover{background:var(--tint)}
.fsec{border-top:1px solid #dcdcdc;padding:16px 0 8px}
.v-b .fsec{border-top-color:var(--line)}
.fsec:first-of-type{border-top:0}
.fsec>button.hd{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;padding:0 4px 12px;font-weight:500;font-size:15px;text-align:left}
.fsec.closed>button.hd{padding-bottom:8px}
.fsec.closed .fbody{display:none}
.fsec.closed .chev{transform:rotate(-90deg)}
.fbody{padding:0 4px}
.ck{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;cursor:pointer;color:var(--ink)}
.ck input{position:absolute;opacity:0;pointer-events:none}
.ck .box{width:20px;height:20px;border-radius:5px;border:1.5px solid #8a8f99;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;background:#fff}
.ck input:checked+.box{background:var(--brand);border-color:var(--brand)}
.ck input:focus-visible+.box{outline:2px solid #8f6bff;outline-offset:2px}
.ck .n{margin-left:auto;color:var(--ink2);font-size:13px}
.ck.dis{opacity:.45}
.rngl{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:4px}
.rngl .mid{color:var(--ink3);font-size:12px}
.dual{position:relative;height:26px;margin:6px 4px 0}
.dual .tr{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:#dfe2ea}
.dual .fl2{position:absolute;top:11px;height:4px;border-radius:2px;background:var(--brand)}
.dual input{position:absolute;left:-10px;width:calc(100% + 20px);top:3px;margin:0;height:20px;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--brand);cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.dual input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--brand);cursor:grab}
.dual input::-webkit-slider-runnable-track{background:none;height:20px}
.dual input::-moz-range-track{background:none;height:20px}
.v-orig .dual .fl2{background:#323439}.v-orig .dual input::-webkit-slider-thumb{border-color:#323439}.v-orig .dual input::-moz-range-thumb{border-color:#323439}
.vsub{font-size:13px;color:var(--ink2);margin:6px 0 4px;display:flex;gap:8px;align-items:center}
.vsub b{font-weight:500;color:var(--ink)}
.legtag{display:inline-flex;align-items:center;gap:4px;background:#4a4b50;color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:500}

/* list header A/B */
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.lhead{background:#fff;border:1px solid var(--line);border-radius:12px;position:relative}
.lh1{display:flex;align-items:center;gap:8px;padding:12px 16px;flex-wrap:wrap}
.lh1 .tool{padding:0 8px 0 12px}
.lh2{display:flex;align-items:flex-end;gap:12px;padding:0 16px 0 16px;border-top:1px solid var(--line)}
.seg{display:inline-flex;background:#f0f1f4;border-radius:12px;padding:4px;gap:0}
.seg button{border:0;background:none;border-radius:8px;padding:10px 16px;font-size:14px;color:var(--ink2);font-weight:500;white-space:nowrap;font-family:inherit}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff;font-weight:500}
.tool{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:14px;color:var(--ink);position:relative;white-space:nowrap}
.tool:hover{border-color:var(--brand)}
.tool[aria-expanded=true]{border-color:var(--brand);background:var(--tint);color:var(--brand)}
.tool[aria-expanded=true] .chev{transform:rotate(180deg)}
.tabs{display:flex;gap:0}
.tabn{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px 8px;text-align:left;display:flex;flex-direction:column;gap:1px;position:relative;font-family:inherit}
.tabn .l{font-size:13px;color:var(--ink2);font-weight:500}
.tabn .p{font-size:18px;font-weight:500;color:var(--ink)}
.tabn:hover .l{color:var(--ink)}
.tabn[aria-selected=true]{border-bottom-color:var(--brand)}
.tabn[aria-selected=true] .l{color:var(--brand);font-weight:500}
.ordw{position:relative;margin-left:auto;padding:10px 0}
.ordw .tool{height:44px}
.ordw .tool b{font-weight:500}
.menu{position:absolute;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,10,60,.18);padding:6px;min-width:240px;right:0;top:calc(100% - 4px)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:8px;text-align:left;font-size:14px;font-family:inherit}
.menu button:hover{background:var(--bg)}
.menu button[aria-checked=true]{font-weight:500}
.menu button .ck3{margin-left:auto;color:var(--brand);display:flex}

/* collapse panel */
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;overflow:hidden}
.collapse.open{grid-template-rows:1fr}
.collapse>.ci{min-height:0;overflow:hidden}
.pbody{padding:16px 16px 18px;border-top:1px solid var(--line)}
.pbody .pt{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pbody .pt b{font-weight:500;font-size:16px}
.xb{width:36px;height:36px;border-radius:50%;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.xb:hover{background:var(--bg)}
.mx{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;border:1px solid #e3e6ec}
.mx th,.mx td{border:1px solid #e9ebf0;text-align:center;padding:0;height:48px}
.mx th{font-weight:500;color:var(--ink);background:#fff;font-size:12px;line-height:1.25}
.mx th.corner{position:relative;width:110px;background:linear-gradient(to top right,transparent calc(50% - .5px),#d5d8df,transparent calc(50% + .5px))}
.mx th.corner span{position:absolute;font-size:12px;font-weight:500}
.mx th.rh{text-align:left;padding-left:10px;width:110px}
.mx td button{width:100%;height:100%;border:0;background:none;font-size:13px;color:var(--ink2);font-family:inherit;padding:0}
.mx td button.g{color:var(--teal);font-weight:600}
.mx td button:hover:not(:disabled){background:var(--tint)}
.mx td button.cur{background:#e8e1fb;outline:1px solid var(--brand);outline-offset:-1px;color:var(--brand);font-weight:600}
.mx td button.low b{display:inline-block;background:#2f7a65;color:#fff;border-radius:6px;padding:7px 8px;font-weight:600}
.mx td button.na{color:#c4c7ce;cursor:not-allowed}
.pnote{font-size:12px;color:#6b707a;margin-top:10px;line-height:1.4}
.trendw{display:flex;gap:28px;align-items:flex-end;padding-top:6px}
.trendw .bars{flex:1;position:relative;height:220px;display:flex;gap:10px;align-items:flex-end;border-bottom:2px solid #20106b;padding:0 4px 0 72px}
.trendw .gl{position:absolute;left:0;right:0;border-top:1px dashed #cfd2da;pointer-events:none}
.trendw .gl span{position:absolute;left:0;top:-9px;width:64px;text-align:right;background:#fff;font-size:12px;font-weight:600;color:var(--ink)}
.trendw .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.trendw .bar button{width:100%;border:0;background:#20106b;border-radius:4px 4px 0 0;padding:0}

/* tooltips */
.tipw{position:relative;display:inline-flex}
.tip{position:absolute;z-index:80;background:#fff;color:var(--ink);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.4;width:max-content;max-width:300px;box-shadow:0 4px 22px rgba(30,20,70,.22);pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s .06s;left:50%;transform:translateX(-50%);bottom:calc(100% + 10px);text-align:left;font-weight:400;border:1px solid #eceef2}
.tip:after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}

.tip.below:after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#fff}
.tip.r{left:auto;right:-8px;transform:none}.tip.r:after{left:auto;right:14px;margin:0}

.tip .tl{display:flex;justify-content:space-between;gap:20px}
.tip .tl.g{color:var(--ink2);margin-top:4px}

    const row=(l,d)=>`<tr><td>${l}</td>${A.map(a=>{const p=cell(a,d);return `<td>${p?`<button class="lk2" style="font-size:14px;font-weight:${p===lo?600:400};color:${p===lo?'var(--teal)':'var(--ink)'}" data-a="airpick" data-n="${a}">R$ ${num(p)}</button>`:'—'}</td>`}).join('')}</tr>`;
    return `<table class="otbl"><thead><tr><th>Companhias</th>${A.map(a=>`<th><b style="font-weight:500">${a}</b><br><span class="rate"><i>${AIRS[a].rate.replace('.',',')}</i> Muito bom</span></th>`).join('')}</tr></thead><tbody>${row('Direto',1)}${row('Com Paradas',0)}</tbody></table>`}
  if(k==='p3d'){
    const dA=S.dates.ida,dV=S.dates.volta,offs=[-3,-2,-1,0,1,2,3];
    const grid=offs.map(a=>offs.map(b=>{const da=addD(dA,a),dv=addD(dV,b);return {a,b,da,dv,ok:(S.trip==='ow'?b===0:dayDiff(dv,da)>=1)&&da>=TODAY,p:priceAt(da,dv)}}));
    const ps=grid.flat().filter(x=>x.ok).map(x=>x.p),lo=Math.min(...ps);
    return `<div class="pbody"><div class="pt"><b>Preços +/- 3 dias</b>${closeX()}</div>
    <table class="mx"><thead><tr><th class="corner"><span style="right:8px;top:6px">Retorno</span><span style="left:8px;bottom:6px">Saída</span></th>${offs.map(b=>`<th>${S.trip==='ow'?'—':fShort(addD(dV,b))}</th>`).join('')}</tr></thead><tbody>${grid.map(row=>`<tr><th class="rh">${fShort(row[0].da)}</th>${row.map(x=>`<td><button class="${x.a===0&&x.b===0?'cur':x.ok&&x.p<=lo*1.03?'low':''} ${x.ok?'':'na'}" ${x.ok?`data-a="p3dpick" data-x="${x.a}" data-y="${x.b}"`:'disabled'} aria-label="Ida ${fLong(x.da)}, volta ${fLong(x.dv)}, ${money(x.p)}">${x.ok?(x.p<=lo*1.03&&!(x.a===0&&x.b===0)?`<b>R$ ${num(x.p)}</b>`:'R$ '+num(x.p)):'—'}</button></td>`).join('')}</tr>`).join('')}</tbody></table>
    <p class="pnote">Os preços são por adulto, com taxas e impostos, e foram encontrados nas últimas 48 horas. Podem mudar até a compra.</p></div>`}
  if(k==='trend'){
    const b0=new Date(S.dates.ida.getFullYear(),S.dates.ida.getMonth(),1),base=baseMin();
    const ms=Array.from({length:12},(_,i)=>{const d=new Date(b0.getFullYear(),b0.getMonth()+i,1),r=rng(hash(S.route.o+S.route.d+'m'+i))();return {d,p:Math.round(base*(0.82+r*0.55)),ok:i>0||true}});
    ms[0].p=Math.round(base);const lo=Math.min(...ms.map(x=>x.p)),hi=Math.max(...ms.map(x=>x.p));if(S.tm==null)S.tm=ms.findIndex(x=>x.p===lo);const sel=ms[S.tm],H=(p)=>Math.round(30+(p-lo)/(hi-lo||1)*70);
    const ln=[hi,Math.round((hi+lo)/2),lo];
    return `<div class="pbody"><div class="pt"><b>Tendência de preços</b>${closeX()}</div><div class="trendw"><div style="flex:1"><div class="bars">${ln.map((p,i)=>`<div class="gl" style="bottom:${H(p)*1.7}px"><span>R$ ${num(p)}</span></div>`).join('')}${ms.map((m,i)=>`<div class="bar"><button class="${i===S.tm?'cs':''}" style="height:${H(m.p)*1.7}px" data-a="trendpick" data-x="${i}" aria-label="${MON[m.d.getMonth()]}, ${money(m.p)}"></button></div>`).join('')}</div><div class="xl">${ms.map(m=>`<span>${MON3[m.d.getMonth()]}</span>`).join('')}</div></div>
    <div class="side2"><small>A partir de</small><b>R$ ${num(sel.p)}</b><span style="color:var(--ink2)">${MON[sel.d.getMonth()]} de ${sel.d.getFullYear()}</span></div></div>
    <p class="pnote">Menor preço por adulto, ida e volta, encontrado nos últimos 30 dias para cada mês. Não inclui garantia de disponibilidade.</p></div>`}
  return '';
}

function legHd(w,c,tags){const o=S.route;const from=w==='ida'?o.o:o.d,to=w==='ida'?o.d:o.o,dt=w==='ida'?S.dates.ida:S.dates.volta;
  const tg={rec:['Recomendado','Melhor equilíbrio entre preço, duração e paradas'],cheap:['Mais barato','Menor preço entre os voos listados'],fast:['Mais rápido','Menor tempo total de viagem']};
  return `<div class="leghd"><span class="legic">${w==='ida'?IC.planeTO(20):IC.land(20)}</span><span class="legtxt"><b>${w==='ida'?'IDA':'VOLTA'}</b>${fLong(dt)}<i></i>${from} → ${to}</span>
   ${tags&&tags.length?`<span class="tags">${tags.map((k,i)=>tipw(`<span class="rectag ${k==='rec'?'':'t2'}">${tg[k][0]}</span>`,tg[k][1],'below','r')).join('')}</span>`:''}</div>`}
function stpLabel(o){if(o.stops>1){const h=o.via.split(' e ');return `${o.stops} paradas <span class="via">${h[0]} +${h.length-1}</span>`}return `${stopsTxt(o)}${o.stops?` <span class="via">${esc(o.via)}</span>`:''}`}
const lnHtml=o=>{if(S.v==='orig'&&o.stops>0){const n=o.stops;return `<span class="ln">${Array.from({length:n},(_,k)=>`<i style="left:calc(50% + ${((k-(n-1)/2)*14)}px)"></i>`).join('')}</span>`}return `<span class="ln"><i class="${o.swap?'sw':''}" style="${o.swap?'background:var(--amber);border-color:var(--amber)':''}"></i></span>`};
function routeLine(o){if(S.v==='orig'&&o.swap)return `<span class="fl has-tip st osw" tabindex="0"><span class="stp">${stopsTxt(o)}<span class="swi">${IC.warn(16)}</span></span><span class="ln"><i></i></span><span class="tip below">${connTip(o)}</span></span>`;return `<span class="fl has-tip ${o.swap?'sw':o.stops?'st':'dir'}" tabindex="0"><span class="stp ${o.stops?'':'dir'} ${o.swap?'swp':''}">${o.swap?'<span class="swpill">Troca de aeroporto</span>':stpLabel(o)}</span>${lnHtml(o)}<span class="tip below">${connTip(o)}</span></span>`}
function optRow(o,w,c,sel,first){const on=sel===o.id,from=w==='ida'?S.route.o:S.route.d,to=w==='ida'?S.route.d:S.route.o;
  const nx=plus1(o);
  return `<div class="opt" role="radio" aria-checked="${on}" tabindex="0" data-a="pick" data-c="${c.id}" data-w="${w}" data-id="${o.id}" aria-label="${o.air}, saída ${o.dep}, chegada ${arrTime(o)}, ${stopsTxt(o)}, ${fdur(o.dur)}">
   <span class="rd"></span><span class="air">${o.air}</span><span class="tm">${tf(o.dep)}</span>${routeLine(o)}
   <span class="tm arr">${tf(arrTime(o))}${nx?'<sup style="font-size:10px;color:var(--ink3);margin-left:2px">+1</sup>':''}</span><span class="du has-tip" tabindex="-1">${fdur(o.dur)}<span class="tip below" role="tooltip">Duração total</span></span>
   <span class="has-tip bgs" tabindex="0">${bagIcons(c.chk)}${bagTip(c.chk)}</span>
   <button class="xp" data-a="modal" data-m="flight" data-id="${o.id}" data-c="${c.id}" aria-label="Detalhes do voo">${IC.chev(20)}</button></div>`}
function detail(o,from,to,c){const sg=segs(o,from,to);
  return `<div class="detail">${sg.parts.map((p,i)=>`<div><div class="seg-l"><b>${tf(p.dep)}</b><span>${p.from} · ${cityName(p.from)}</span></div><div class="seg-l" style="color:var(--ink3);font-size:12px"><span></span><span>${o.air} ${p.fn} · ${fdurL(p.d)}</span></div><div class="seg-l"><b>${tf(p.arr)}</b><span>${p.to} · ${cityName(p.to)}</span></div>${sg.conn[i]?`<div class="layov" style="margin-left:62px">${sg.conn[i].swap?`Mudança de aeroporto: ${sg.conn[i].at} → ${sg.conn[i].swap}. Espera de ${fdurL(sg.conn[i].m)}`:`Troca de avião em ${esc(sg.conn[i].at)}: ${fdurL(sg.conn[i].m)}`}</div>`:''}</div>`).join('')}
  <button class="lk" data-a="modal" data-m="flight" data-id="${o.id}" data-c="${c.id}">Ver detalhes do voo</button></div>`}
const infoTip=c=>tipw(`<button class="infob" aria-label="Detalhes do preço">${IC.info(16)}</button>`,`<b>Como o preço é formado</b><span class="tl"><span>Tarifa</span><span>${money(c.price*.855)}</span></span><span class="tl"><span>Taxas e impostos</span><span>${money(c.price*.145)}</span></span><span class="tl g"><span>Total por adulto</span><span>${money(c.price)}</span></span>`,'','r');

const fOrig=d=>`${DOW[d.getDay()]}. ${d.getDate()} ${MON3[d.getMonth()]}. ${d.getFullYear()}`;
const chevD=()=>IC.chev(22);
function oOpt(o,w,c,sel){const on=sel===o.id,nx=plus1(o);
  return `<div class="orow ${on?'on':''}" role="radio" aria-checked="${on}" tabindex="0" data-a="pick" data-c="${c.id}" data-w="${w}" data-id="${o.id}" aria-label="${o.air}, saída ${o.dep}, chegada ${arrTime(o)}, ${stopsTxt(o)}">
   <div class="c1"><span class="rd"></span>${alogo(o.air)}<span class="air">${o.air}</span></div>
   <div class="c2"><span class="tm">${o.dep}</span>${routeLine(o)}</div>
   <div class="c3"><span class="tm">${arrTime(o)}${nx?'<span class="plus1">+1</span>':''}</span><span class="du">${fdurO(o.dur)}</span></div>
   <div class="c4"><span class="has-tip" tabindex="0">${bagsFor(c)}${bagTip(c.chk)}</span><button class="xp" data-a="modal" data-m="flight" data-id="${o.id}" data-c="${c.id}" aria-label="Detalhes do voo">${chevD()}</button></div></div>`}
function oLeg(w,c,sel){const from=w==='ida'?S.route.o:S.route.d,to=w==='ida'?S.route.d:S.route.o,dt=w==='ida'?S.dates.ida:S.dates.volta;
  return `<div class="oleg"><div class="tile"><b>${w==='ida'?IC.planeTO(20):IC.land(20)}${w==='ida'?'IDA':'VOLTA'}</b><small>${fOrig(dt)}</small></div><div class="ap"><b>${from}</b><small>${cityName(from)}</small></div><div class="ap"><b>${to}</b><small>${cityName(to)}</small></div><div class="ap"><b>&nbsp;</b><small>Bagagem</small></div>${c[w].map(o=>oOpt(o,w,c,sel)).join('')}</div>`}
function cardO(c,k){const s=selFor(c),p=c.price,base=Math.round(p*.855),tx=p-base;
  const banner=k===0?`<div class="ostrip"><span class="t0">Selecionamos esses voos para que você tenha mais opções de viagem</span>${tipw(`<button class="infob ibt" style="color:var(--brand)" aria-label="Informação">${IC.info(22)}</button>`,'Ao comprar essas passagens, tenha em conta que as alterações e cancelamentos dos voos deverão ser gerenciados por separado.','below','l')}<img class="bnr" src="${IMG.banner}" width="78" height="44" alt=""></div>`:'';
  return `<article class="card ocard"><div class="lft">${banner}${oLeg('ida',c,s.i)}${c.vol.length?oLeg('vol',c,s.v):''}<div class="addbag">${c.chk?OICON.flex+'<span>Adicione flexibilidade de datas e reembolso</span>':OICON.bag+'<span>Adicione bagagem mudando de categoria</span>'}<button data-a="modal" data-m="fares" data-c="${c.id}">Ver opções</button></div></div>
   <div class="rgt"><div class="top"><span class="lbl">Preço por adulto</span><button class="heart" data-a="fav" data-c="${c.id}" aria-pressed="${!!S.fav[c.id]}" aria-label="Favoritar">${IC.heart(20)}</button></div><div class="price" style="margin-top:-6px"><small>R$</small><b>${num(base)}</b></div>
   <div class="row-p" style="margin-top:4px"><span>1 Adulto</span><b>${money(base)}</b></div><div class="row-p"><span>Impostos, taxas e encargos</span><b>${money(tx)}</b></div>

const oBags=c=>`<span class="has-tip" tabindex="0">${bagsFor(c)}${bagTip(c.chk)}</span>`;
function oCols(c,o,w){const from=w==='ida'?S.route.o:S.route.d,to=w==='ida'?S.route.d:S.route.o;

const moreBtn=()=>`<button class="btn line more" data-a="more">Ver mais voos</button>`;
function rList(){
  const el=$('#list');if(!el)return;
  if(S.loading){el.innerHTML=`<div class="list" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;return}
  const vis=visibleCards(),T=tops();let h='';

  vis.forEach(c=>{c._tags=[];const pr=[S.sort,'rec','cheap','fast'].filter((k,i,a)=>T[k]&&a.indexOf(k)===i);const k=pr.find(k=>T[k].id===c.id);if(k)c._tags=[k]});
  const n=S.shown;
  if(S.mode==='sep'){
    const w=S.stage==='ida'?'ida':'vol',cards=vis.slice().sort((a,b)=>sepCardKey(S.sort,a,w)-sepCardKey(S.sort,b,w)||a.price-b.price);
    if(S.v==='orig'){const items=[];cards.forEach(c=>c[w].forEach(o=>items.push({c,o})));items.sort((a,b)=>sepKey(S.sort,a.c,a.o)-sepKey(S.sort,b.c,b.o)||a.c.price-b.c.price);
      const mp=Math.min(...items.map(x=>x.c.price)),md=Math.min(...items.map(x=>x.o.dur));let tc=false,tf2=false;
      const hd=S.stage==='ida'?`<h2>${IC.planeTO(26)}Selecione o seu voo de ida</h2>`:`<h2>${IC.planeTO(26)}Seu voo de ida</h2>${oSepSummary()}<h2>${IC.land(26)}Selecione o seu voo de volta</h2>`;

    else h=`<div class="list">${cards.slice(0,n).map((c,k)=>cardSep(c,w)+(k===2?sofiaBanner():'')).join('')}</div>${cards.length>n?moreBtn():''}`;

  }else{
    h=`<div class="list">${vis.slice(0,n).map((c,k)=>cardAB(c)+(k===2?sofiaBanner():'')).join('')}</div>${vis.length>n?moreBtn():''}`;
  }
  el.innerHTML=h;
}

   case 'ordpick':S.sort=D.k;S.ordOpen=false;rLHead();rList();break;
   case 'panel':setPanel(D.k);break;
   case 'closepanel':setPanel(S.panel);break;
   case 'airpick':{S.f.air={Azul:0,Gol:0,LATAM:0};S.f.air[D.n]=1;refreshFilters();toast(`Mostrando só voos da ${D.n}.`);break}
   case 'p3dpick':{const da=addD(S.dates.ida,+D.x),dv=addD(S.dates.volta,+D.y);S.panel=null;go(()=>{S.dates={ida:da,volta:dv};S.draft=mkDraft();newSearch(true)},700);break}
   case 'trendpick':S.tm=+D.x;rPanelOnly();break;
   case 'seg':if(S.mode!==D.k){S.mode=D.k;S.stage='ida';S.pick=null;S.shown=9;rLHead();rStep();rList()}break;
   case 'stepback':S.stage='ida';S.pick=null;rStep();rList();break;
   case 'pick':{const s=S.sel[D.c]||(S.sel[D.c]={});if(D.w==='ida')s.i=D.id;else s.v=D.id;rList();break}
   case 'xp':e.stopPropagation();S.open[D.id]=!S.open[D.id];rList();break;
   case 'modal':S.modal={t:D.m,c:D.c,id:D.id};rOv();break;
   case 'scrim':if(e.target===t){S.modal=null;rOv()}break;
   case 'closemodal':S.modal=null;rOv();break;
   case 'fav':S.fav[D.c]=!S.fav[D.c];t.setAttribute('aria-pressed',!!S.fav[D.c]);if(S.fav[D.c])toast('Voo salvo nos favoritos');break;
   case 'select':{const c=S.cards.find(x=>x.id===D.c),s=selFor(c);
     const i=(D.i?c.ida.find(o=>o.id===D.i):c.ida.find(o=>o.id===s.i))||c.ida[0];const vv=c.vol.length?((D.v?c.vol.find(o=>o.id===D.v):c.vol.find(o=>o.id===s.v))||c.vol[0]):null;
     S.chosen={card:c,i,v:vv};S.tariff=c.chk?'comfort':'basic';S.view='next';rBody();window.scrollTo(0,0);break}
   case 'selectfare':{const c=S.cards.find(x=>x.id===D.c),s=selFor(c);S.chosen={card:c,i:c.ida.find(o=>o.id===s.i)||c.ida[0],v:c.vol.length?(c.vol.find(o=>o.id===s.v)||c.vol[0]):null};if(fareAdd(c,D.k)===null)break;S.tariff=D.k;S.modal=null;S.view='next';rAll();window.scrollTo(0,0);break}
   case 'selectleg':{const c=S.cards.find(x=>x.id===D.c),s=selFor(c),w=D.w,o=D.id?[...c.ida,...c.vol].find(x=>x.id===D.id):c[w].find(x=>x.id===(w==='ida'?s.i:s.v));
     if(w==='ida'&&S.trip==='rt'){S.pick={c,o};S.stage='volta';S.shown=9;rStep();rList();window.scrollTo(0,0)}
     else{const price=S.pick?Math.round((S.pick.c.price+c.price)/2):Math.round(c.price/2);S.chosen={card:{...c,price},i:S.pick?S.pick.o:o,v:S.pick?o:null};if(S.trip==='ow')S.chosen.v=null;S.tariff=c.chk?'comfort':'basic';S.view='next';rBody();window.scrollTo(0,0)}break}
   case 'tariff':S.tariff=D.k;rNext();break;
   case 'continue':toast('Aqui termina o trecho testado do protótipo.');break;
   case 'backres':S.view='results';rBody();break;
   case 'cart':S.cart++;{const b=$('#cartb');if(b){b.textContent=S.cart;b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}t.classList.add('done');const o=t.innerHTML;t.innerHTML=t.classList.contains('addb')?IC.check(18)+'Adicionado':IC.check(22);setTimeout(()=>{t.classList.remove('done');t.innerHTML=o},1800)}toast('Voo adicionado ao carrinho',`${S.cart} ${S.cart>1?'itens':'item'} no carrinho`);break;
   case 'more':S.shown+=4;rList();break;
   case 'sofia':S.drawer='sofia';rOv();break;
   case 'closedrawer':S.drawer=null;rOv();break;
   case 'sofiaq':S.sort=D.k;S.drawer=null;rLHead();rList();rOv();toast('Ordenei a lista para você');break;
   case 'alert':S.modal={t:'alert'};rOv();break;
   case 'alertok':S.modal=null;rOv();toast('Alerta criado','Avisamos por e-mail quando o preço cair');break;
   case 'open':location.hash=D.t;break;
   case 'copy':{const link=shareBase()+'#'+D.t;const done=()=>toast('Link copiado.');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(link).then(done,()=>toast(link));else toast(link);break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.a==='fck'){const [k,v]=t.dataset.n.split(':'),f=S.f;
    if(k==='stops')f.stops=(f.stops===v&&v!=='all')?'all':v;
    else if(k==='bag')f.bag=(f.bag===v&&v!=='all')?'all':v;
    else if(k==='air'){f.air[v]=f.air[v]?0:1;if(!Object.values(f.air).some(Boolean))f.air[v]=1}
    else if(k==='cab'){f.cab[v]=f.cab[v]?0:1}
    refreshFilters();return}
  if(t.dataset.a==='rng'){rSide();return}
  if(t.id==='cls-sel'){S.draft.cls=t.value;repaintFields()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='sbase'){try{localStorage.setItem('shareBase',e.target.value)}catch(err){}return}
  const t=e.target;
  if(t.dataset.a==='rng'){const k=t.dataset.k,i=+t.dataset.i,f=S.f;let arr=k==='price'?[f.pmin,f.pmax]:f[k];arr=[...arr];let v=+t.value;const gap=k==='price'?10:(k.startsWith('d')?15:20);
    if(i===0)v=Math.min(v,arr[1]-gap);else v=Math.max(v,arr[0]+gap);arr[i]=v;t.value=v;
    if(k==='price'){f.pmin=arr[0];f.pmax=arr[1];if(f.pmin>S.pLo||f.pmax<S.pHi)f.act.price=1;else delete f.act.price;$('#pl0').textContent=money(arr[0]);$('#pl1').textContent=money(arr[1])}
    else{f[k]=arr;f.act[k]=1;const ids={hi:['hl',ftime],hv:['vl',ftime],di:['dl',m=>fdur(m)+'m'],dv:['el',m=>fdur(m)+'m']}[k];$('#'+ids[0]+'0').textContent=ids[1](arr[0]);$('#'+ids[0]+'1').textContent=ids[1](arr[1])}
    const box=t.closest('.dual'),lo=+box.querySelector('input').min,hi=+box.querySelector('input').max,fl=box.querySelector('.fl2');
    fl.style.left=(arr[0]-lo)/(hi-lo)*100+'%';fl.style.right=100-(arr[1]-lo)/(hi-lo)*100+'%';
    rLHead();rList();return}
  if(t.classList.contains('cityin')){S.pop=t.dataset.w;S.q=t.value;rPop()}
});
document.addEventListener('focusin',e=>{const t=e.target;
  if(t.classList&&t.classList.contains('cityin')&&S.pop!==t.dataset.w){S.pop=t.dataset.w;S.q='';rPop();$$('[data-p]').forEach(b=>b.setAttribute('aria-expanded','false'));t.select()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.modal||S.drawer){S.modal=null;S.drawer=null;rOv()}else if(S.pop||S.prodOpen||S.ordOpen){closeAll()}else if(S.searchOpen&&S.v==='b'){S.searchOpen=false;rHead()}}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=radio].opt,[role=switch]')){e.preventDefault();e.target.click()}
  if(e.altKey&&e.shiftKey&&(e.key==='M'||e.key==='m'||e.code==='KeyM')){location.hash='painel';}
});
function onHash(){const h=location.hash.replace('#','');setToken(h);rAll();window.scrollTo(0,0)}
window.addEventListener('hashchange',onHash);
mkApp();onHash();

document.addEventListener('mouseover',e=>{const b=e.target.closest('[data-a=calday]');if(!b||!S.draft||S.draft.trip==='ow'||S.calSel!=='volta'||!S.draft.ida)return;const dt=b.dataset.d,i0=iso(S.draft.ida);
  $$('[data-a=calday]').forEach(x=>{const d=x.dataset.d;x.classList.toggle('prev',d>i0&&d<dt);x.classList.toggle('prevend',d===dt&&d>i0)})});
