<style>
/* Layout: lista de voos desktop; coluna de filtros, lista de cards, coluna de anúncios, rodapé. Visual único, claro. */
:root{
  --brand:#4300d2; --brand-d:#3500a8; --band:#230f6e; --field:#463481; --tint:#f3eefe;
  --ink:#323439; --ink2:#565a60; --ink3:#72777f; --line:#dde1e8; --bg:#f2f4f5; --pg:#eeeeee; --surf:#fff;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.35}

.progress{position:fixed;left:0;right:0;top:0;height:3px;z-index:200;pointer-events:none}
.progress i{display:block;height:100%;width:0;background:#8f6bff;transition:width .6s ease,opacity .3s}

/* top bar */
.topbar{background:var(--band);color:#fff;height:60px;display:flex;align-items:center;gap:8px;padding:0 52px 0 52px}
.logo{display:flex;align-items:center;gap:8px;font-weight:500;font-size:26px;letter-spacing:-.5px;color:#fff;text-decoration:none;margin-right:12px}

.sp{flex:1}
.tlink{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:#fff;background:none;border:0;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none}
.tlink:hover{background:rgba(255,255,255,.1)}

.tlink.tel:hover{background:#fff}

.prodbtn{display:flex;align-items:center;gap:10px;padding:0 12px 0 10px;height:36px;border-radius:8px;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:500;font-size:13px}
.prodbtn:hover{background:rgba(255,255,255,.2)}

.prodbtn[aria-expanded=true] .chev{transform:rotate(180deg)}

.badge{position:absolute;right:2px;top:0;background:#c43c28;color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center}
.vsep{width:1px;height:22px;background:rgba(255,255,255,.35);margin:0 6px}
.flagc{width:22px;height:22px;border-radius:50%;background:#8b8795;display:flex;align-items:center;justify-content:center;color:#fff}

/* product nav */
.pnav{background:var(--band);color:#fff;display:flex;gap:0;padding:0 52px 0 40px;height:100px}
.pnav button{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;width:88px;padding:14px 0 0;font-size:12px;position:relative;font-family:inherit}
.pnav .ic{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;position:relative}
.pnav button.on .ic{background:#fff;color:var(--band)}
.pnav button.on span.lb{border-bottom:2px solid #fff;padding-bottom:1px}
.pnav button:hover .ic{background:rgba(255,255,255,.22)}
.pnav button.on:hover .ic{background:#fff}
.pnav .tg{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#d8f5ea;color:#0a5a3c;border-radius:4px;font-size:10px;padding:1px 6px;font-weight:500;white-space:nowrap}
.pnav .tg.nv{background:#fff;color:#2a2a2a}

/* band (B) */
.band{background:var(--band);padding:20px 52px 24px 52px;color:#fff;position:relative}
.sumrow{display:flex;gap:20px;align-items:stretch}
.sumfield{font-weight:400;flex:1;display:flex;align-items:center;gap:14px;height:50px;padding:0 16px;border-radius:12px;background:var(--field);border:0;color:#fff;font-size:15px;text-align:left}
.sumfield:hover{background:#503e90}
.sumfield .dot{opacity:.7}
.sumfield .grow{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datep{display:flex;align-items:center;gap:0}
.datep button.arr{width:50px;height:50px;border-radius:12px;border:0;background:var(--field);color:#fff;display:flex;align-items:center;justify-content:center}
.datep button.arr:hover:not(:disabled){background:#503e90}
.datep button:disabled{opacity:.4;cursor:not-allowed}
.datep .dl{width:110px;text-align:center;font-size:15px;white-space:nowrap}
.editrow{display:flex;gap:6px;align-items:flex-start;animation:fi .22s}
.editrow .trip{width:176px;flex:none}

/* search fields (original look) */
.sfield{background:#fff;color:var(--ink);border-radius:8px;border:1px solid #cfd3dc;height:56px;padding:0 12px;display:flex;align-items:center;gap:10px;position:relative;min-width:0;text-align:left}
.sfield .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.sfield small{font-size:11px;color:#6f747c;line-height:1.1}

.sfield .v{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.sfield:focus-within{outline:2px solid #8f6bff}
.sfield .ico{color:#444;display:flex}
.sfield.btnf{cursor:pointer;font:inherit}
.sfield.btnf:hover{border-color:#8f6bff}
.sfield .dv{width:1px;height:30px;background:#cfd3dc;margin:0 12px}
.sel{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;height:56px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:14px;width:100%;position:relative}
.sel:hover{background:rgba(255,255,255,.2)}
.sel[aria-expanded=true] svg{transform:rotate(180deg)}
.swapb{position:absolute;right:-18px;top:50%;margin-top:-16px;width:32px;height:32px;border-radius:6px;border:1px solid #cfd3dc;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;z-index:3;padding:0}
.swapb:hover{background:var(--bg)}
.btn{height:46px;border-radius:999px;border:0;background:var(--brand);color:#fff;font-weight:500;padding:0 28px;font-size:15px}
.btn:hover{background:var(--brand-d)}
.btn.light{background:#fff;color:var(--brand)}
.btn.light:hover{background:#efeaff}
.btn.red{background:var(--red);color:#fff}
.btn.red:hover{background:#c91409}
.btn.line{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.line:hover{background:var(--tint)}
.btn.sm{height:40px;font-size:14px;padding:0 22px}
.btn.srch{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:500;height:56px;padding:0 24px;min-width:128px}

/* popovers */
.slot{position:absolute;left:0;top:100%;z-index:70}

.cartb{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--brand);background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.cartb:hover{background:var(--tint)}
.incl{border-top:1px solid var(--line);margin:8px -12px 0 -13px;padding:12px 12px 0 13px;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.lk2{background:none;border:0;padding:0;color:var(--brand);font-weight:500;font-size:12px;display:inline-flex;align-items:center;gap:2px;text-align:left;font-family:inherit}
.lk2:hover{text-decoration:underline}

/* orig card */
.ocard .lft{display:flex;flex-direction:column}
.ostrip{padding:0 12px;height:50px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;border-bottom:1px solid var(--line)}
.ostrip.ad{padding:0;height:36px;justify-content:space-between;border:0}
.ostrip.ad b{background:#e6dffb;color:#2a1486;font-size:12px;font-weight:500;padding:0 12px;height:36px;display:flex;align-items:center;border-radius:12px 0 8px 0}
.ostrip.ad span{margin-right:12px;font-size:12px;color:var(--ink3)}
.oleg{display:grid;grid-template-columns:158px 143px 150px 1fr;border-top:1px solid var(--line)}
.ostrip+.oleg{border-top:0}
.oleg .tile{background:#f1f2f4;border-radius:0 0 12px 0;padding:10px 12px;font-size:14px}
.oleg .tile b{display:flex;gap:6px;align-items:center;font-weight:600;font-size:15px}
.oleg .tile small{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.oleg .ap{padding:12px 0 0 10px}
.oleg .ap b{display:block;font-weight:600;font-size:14px}
.oleg .ap small{font-size:12px;color:var(--ink3)}
.orow{display:contents}
.orow>*{height:56px;display:flex;align-items:center;min-width:0}
.orow .c1{padding-left:14px;gap:10px;cursor:pointer}
.orow .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid #8a8f99;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.orow.on .rd{border-color:var(--brand)}
.orow.on .rd:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.orow .air{font-size:12px;color:var(--ink2)}
.orow .tm{font-size:17px;font-weight:600;white-space:nowrap}
.orow .c2{padding-left:10px;gap:10px}
.orow .c2 .fl{flex:1;min-width:0;max-width:78px}
.orow .c3{padding-left:10px;gap:12px}
.orow .du{font-size:13px;color:var(--ink2);white-space:nowrap}
.orow .c4{padding-left:10px;gap:14px}
.ocard .strip2{display:flex;align-items:center;gap:14px;padding:0 16px 0 22px;height:78px;border-top:1px solid var(--line);font-size:15px;font-weight:500}
.ocard .strip2 .vb{margin-left:auto}
.ocard .strip2 .btn{height:36px;font-size:14px;padding:0 20px}
.ocard .rgt{width:211px;padding:14px 12px 14px 13px;gap:2px}
.ocard .rgt .top{display:flex;justify-content:space-between;align-items:flex-start}
.heart{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--brand);background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.heart:hover{background:var(--tint)}
.heart[aria-pressed=true]{background:var(--brand);color:#fff}
.row-p{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2)}
.row-p b{font-weight:400;color:var(--ink2);white-space:nowrap}
.final{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 8px}
.final span{font-size:14px;font-weight:600}
.final b{font-size:14px;font-weight:600}
.ocard .cta{flex-direction:column;align-items:stretch;gap:8px}
.ocard .cta .btn{width:100%;flex:none}
.ocard .addb{height:36px;border-radius:999px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.ocard .addb:hover{background:var(--tint)}

/* banner & more */
.sofia{background:linear-gradient(100deg,#fff 0%,#e0f7f1 100%);border:1px solid var(--line);border-radius:12px;padding:26px 16px 20px 16px;display:flex;flex-direction:column;gap:4px}
.sofia h3{margin:0;font-size:23px;font-weight:500}
.sofia p{margin:0 0 14px;color:var(--ink);font-size:16px}
.more{align-self:center;margin:44px auto 56px;display:block;background:transparent;height:48px;padding:0 20px}
.empty{background:#fff;border:1px dashed #c3c7d1;border-radius:12px;padding:40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{margin:0;font-weight:500}.empty p{margin:0;color:var(--ink2)}
.skel{background:#fff;border:1px solid var(--line);border-radius:12px;height:230px;position:relative;overflow:hidden}
.skel:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(120,100,220,.10) 50%,transparent 80%);transform:translateX(-100%);animation:sh 1.1s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.stepbar{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px}
.stepbar .st{display:flex;align-items:center;gap:8px;color:var(--ink3)}
.stepbar .st.on{color:var(--ink);font-weight:500}
.stepbar .st i{width:24px;height:24px;border-radius:50%;background:#e7e9ee;color:var(--ink2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:500}
.stepbar .st.on i{background:var(--brand);color:#fff}
.stepbar .st.done i{background:var(--green);color:#fff}
.stepbar .line{flex:0 0 40px;height:1px;background:var(--line)}
.stepbar .back{margin-left:auto;background:none;border:0;color:var(--brand);font-weight:500}

/* ads */
.ads{display:flex;flex-direction:column;gap:56px}
.adx{position:relative;width:160px;overflow:hidden;color:#fff;font-family:var(--f)}
.adx .info{position:absolute;right:0;top:0;display:flex;gap:1px;z-index:3}
.adx .info i{width:14px;height:16px;background:rgba(255,255,255,.85);color:#555;font-size:10px;font-style:normal;display:flex;align-items:center;justify-content:center}
.ad1{height:520px;background:#12301f;display:flex;flex-direction:column;align-items:center;padding-top:44px}
.ad1 .brand{font-weight:600;font-size:18px;display:flex;gap:6px;align-items:center}
.ad1 .hl{margin-top:28px;text-align:center;line-height:1.05}
.ad1 .hl .tg{display:inline-block;background:#6cf26b;color:#102a1a;font-weight:600;font-size:26px;padding:2px 8px;margin-bottom:6px}
.ad1 .hl .t2{font-size:26px;font-weight:600;line-height:1.1}
.ad1 .hl .t3{font-size:15px;margin-top:12px;line-height:1.25;font-weight:400;text-align:left;padding:0 14px}
.ad1 .art{position:absolute;left:0;right:0;bottom:0;height:170px;background:#4cdc4a;overflow:hidden}
.ad1 .art:before{content:"";position:absolute;left:-30px;top:-20px;width:120px;height:240px;background:#8cf08a;transform:skewX(-20deg)}
.ad1 .art .ph{position:absolute;right:-10px;bottom:-30px;width:130px;height:190px;background:#b3837a;border-radius:20px 20px 0 0}
.ad1 .art .sk{position:absolute;right:30px;bottom:130px;width:70px;height:70px;border-radius:50%;background:#e2a875}
.ad2{height:585px;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.ad2 .lg{font-weight:600;font-size:22px;letter-spacing:.04em;display:flex;gap:8px;align-items:center}
.ad2 .bt{background:#fff;color:#000;font-size:10px;padding:6px 14px;clip-path:polygon(0 0,100% 0,100% 70%,88% 100%,0 100%)}
.ad3{height:430px;background:linear-gradient(180deg,#1b2b6b,#0d1536);display:flex;flex-direction:column;align-items:center;padding:60px 14px 0;text-align:center;gap:12px}
.ad3 .t1{font-size:22px;font-weight:600;line-height:1.15}.ad3 .t2{font-size:14px;color:#cfd6ff}
.ad3 .bt{background:#ffd24d;color:#222;font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;margin-top:8px}
.adwide{width:726px;height:86px;margin:0 auto;background:#000;display:flex;align-items:center;justify-content:center;gap:22px;position:relative;color:#fff}
.adwide .lg{font-weight:600;font-size:26px;letter-spacing:.04em;display:flex;gap:8px;align-items:center}
.adwide .bt{background:#fff;color:#000;font-size:12px;padding:10px 26px;clip-path:polygon(0 0,100% 0,100% 70%,92% 100%,0 100%)}
.adwide .info{position:absolute;right:0;top:0;display:flex;gap:1px}
.adwide .info i{width:16px;height:16px;background:rgba(255,255,255,.85);color:#555;font-size:11px;font-style:normal;display:flex;align-items:center;justify-content:center}

/* footer */
.foot{background:var(--pg);padding:0 0 0}
.fwrap{max-width:1050px;margin:0 auto;padding:0 20px}
.news{display:flex;gap:30px;align-items:flex-start;justify-content:center;padding:84px 0 70px}
.news h4{margin:0 0 12px;font-size:20px;font-weight:500;color:#3a3b40}
.news .inrow{display:flex;gap:40px;align-items:center}
.news input{width:380px;height:36px;border:1px solid #9aa0ab;border-radius:4px;padding:0 16px;font-style:italic;font-size:14px;background:#fff}
.news p{font-size:12px;color:#7b8088;margin:14px 0 0;max-width:460px;line-height:1.35}
.soc{display:flex;gap:22px;justify-content:center;color:#6b6f77;padding:20px 0 40px}
.fcols{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:0 0 80px 0}
.fcols h5{margin:0 0 6px;font-size:14px;font-weight:500}
.fcols a{display:block;color:#323439;text-decoration:none;font-size:14px;padding:5px 0}
.fcols select{height:36px;width:100%;border:1px solid #9aa0ab;border-radius:4px;padding:0 10px;background:#fff;font-size:14px;margin-top:6px}
.badge2{width:78px;height:60px;margin:0 auto 70px;background:#fff;color:#006b9a;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;border:1px solid #d8e2ea}
.legal{display:grid;grid-template-columns:1fr 1fr;gap:12px 30px;font-size:12px;color:#6b6f77;line-height:1.4;padding-bottom:120px}
.legal b{color:#323439;font-weight:500}

/* tooltips */
.tipw{position:relative;display:inline-flex}
.tip{position:absolute;z-index:80;background:#fff;color:var(--ink);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.4;width:max-content;max-width:300px;box-shadow:0 4px 22px rgba(30,20,70,.22);pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s .06s;left:50%;transform:translateX(-50%);bottom:calc(100% + 10px);text-align:left;font-weight:400;border:1px solid #eceef2}
.tip:after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}
.tip.below{bottom:auto;top:calc(100% + 10px)}
.tip.below:after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#fff}
.tip.r{left:auto;right:-8px;transform:none}.tip.r:after{left:auto;right:14px;margin:0}
.tip.l{left:-8px;transform:none}.tip.l:after{left:18px;margin:0}
.tip b{font-weight:600;display:block;margin-bottom:2px}
.tip .tl{display:flex;justify-content:space-between;gap:20px}
.tip .tl.g{color:var(--ink2);margin-top:4px}
.tip .bi{display:flex;gap:10px;align-items:flex-start;padding:6px 0;min-width:240px}
.tip .bi+.bi{border-top:1px solid var(--line)}
.tip .bi .t{color:var(--teal);font-weight:500}.tip .bi.off .t{color:#767779}
.tip .bi small{display:block;color:var(--ink2);font-size:12px}
.tip .rt{display:flex;gap:10px;align-items:center;margin-top:6px}
.tip .rt i{font-style:normal;background:var(--teal);color:#fff;border-radius:4px;padding:2px 6px;font-weight:500;font-size:12px}
.tip .wa{color:var(--amber);font-weight:600}
.has-tip:hover>.tip,.has-tip:has(:focus-visible)>.tip,.has-tip:focus-visible>.tip{opacity:1;visibility:visible}
.has-tip{position:relative}

/* modal / overlay */
.scrim{position:fixed;inset:0;background:rgba(20,10,50,.5);z-index:120;display:flex;align-items:center;justify-content:center;padding:24px;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.modal{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:up .2s}
.modal.nrw{max-width:640px}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;z-index:2;flex:none;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:18px;font-weight:500}
.modal .mb{overflow:auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:14px}
.fcard{border:1px solid #dfe2e8;border-radius:8px;font-size:13px}
.fcard .h{display:flex;justify-content:space-between;align-items:center;padding:14px 14px;border-bottom:1px solid var(--line);font-size:16px}
.fcard .h .rt{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--teal)}
.fcard .h .rt i{font-style:normal;background:var(--teal);color:#fff;border-radius:4px;padding:3px 7px;font-weight:500}
.fcard .m{display:flex;justify-content:space-between;padding:10px 14px;color:var(--ink2);border-bottom:1px solid var(--line)}
.fcard .op{margin:8px 12px;border:1px solid #dfe2e8;border-radius:6px;text-align:center;font-size:12px;padding:3px;color:var(--ink2)}
.fcard .no{padding:8px 14px;color:var(--ink2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fcard .tms{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:14px;align-items:start}
.fcard .tms .c{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2)}
.fcard .tms .c.rr{align-items:flex-end;text-align:right}
.fcard .tms .c b{font-size:24px;color:#4a4d54;font-weight:600;line-height:1.1;margin-top:2px}
.fcard .tms .c .ap{font-size:16px;font-weight:600;color:#6a6f78}
.fcard .tms .md{align-self:center;display:flex;gap:6px;align-items:center;color:#9aa0ab;font-size:12px;text-align:center}
.fcard .tms .md b{display:block;color:var(--ink);font-size:13px;margin:0;font-weight:600}
.wait{background:#f1f2f4;border-radius:6px;text-align:center;padding:10px;font-size:14px}
.dur{background:#f1f2f4;border-radius:6px;text-align:center;padding:10px;font-size:14px}
.bagbox{border:1px solid #dfe2e8;border-radius:6px;padding:14px;display:grid;grid-template-columns:90px 1fr;gap:12px;font-size:14px}
.bagbox .col{border-left:1px solid var(--line);padding-left:20px;display:flex;flex-direction:column;gap:14px}
.bagbox .col b{font-weight:400;color:var(--teal);display:block}
.bagbox .col .off b{color:#767779}
.bagbox .col span{color:var(--ink2)}
.swwarn{background:#fff6e5;border:1px solid #f3dca4;border-radius:8px;padding:10px 12px;font-size:13px;color:#6b4b00;display:flex;gap:10px;align-items:flex-start}
.fares{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fare{border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.fare.rec{border-color:var(--brand)}
.fare h4{margin:0;font-size:16px;font-weight:500}
.fare .fp{font-size:22px;font-weight:500}
.fare ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink2)}
.fare li{display:flex;gap:8px;align-items:flex-start}
.fare li.no{color:#a0a5b0;text-decoration:line-through}
.fare .tagr{position:absolute;top:-10px;left:12px;background:var(--brand);color:#fff;border-radius:6px;font-size:11px;padding:2px 8px;font-weight:500}
.ok{color:var(--green)}.nok{color:#a0a5b0}
.fld2{display:flex;flex-direction:column;gap:4px}
.fld2 label{font-size:12px;color:var(--ink2)}
.inp2{height:46px;border-radius:10px;border:1px solid var(--line);padding:0 12px;font-size:14px;width:100%}

/* product overlay */
.prodmenu{position:absolute;z-index:90;left:0;top:44px;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 14px 40px rgba(10,5,40,.35);padding:12px;width:420px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;animation:up .16s}
.prodmenu button{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;border-radius:10px;padding:14px 4px;font-size:13px;color:var(--ink);font-weight:500;position:relative;font-family:inherit}
.prodmenu button:hover{background:var(--bg)}
.prodmenu button.cur{background:var(--tint);color:var(--brand)}
.prodmenu .ic{width:44px;height:44px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.prodmenu button.cur .ic{background:var(--brand);color:#fff}
.prodmenu small{font-size:10px;font-weight:400;color:var(--ink3)}

/* next step */
.next{max-width:1100px;margin:0 auto;padding:24px 40px 60px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.next h2{margin:0 0 4px;font-size:24px;font-weight:500}
.nxcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.nxcard h3{margin:0;font-size:16px;font-weight:500}
.tar{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;width:100%;background:#fff;text-align:left;font-family:inherit}
.tar[aria-checked=true]{border-color:var(--brand);background:#faf8ff}
.tar .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid #9aa0ab;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.tar[aria-checked=true] .rd{border-color:var(--brand)}
.tar[aria-checked=true] .rd:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.tar .tp{margin-left:auto;font-weight:500;white-space:nowrap}
.tar small{display:block;color:var(--ink2);font-size:12px;margin-top:3px}
.endnote{background:#eaf6ff;border:1px solid #b7dcf5;border-radius:12px;padding:12px 16px;font-size:13px;color:#134a6b}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2b30;color:#fff;padding:12px 18px;border-radius:10px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px;animation:up .2s}
.drawer{position:fixed;right:24px;bottom:24px;width:340px;background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(20,10,60,.3);z-index:130;overflow:hidden;animation:up .2s;border:1px solid var(--line)}
.drawer .dh{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;font-weight:500}
.drawer .db{padding:16px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.bub{background:var(--bg);border-radius:12px 12px 12px 4px;padding:10px 12px;max-width:90%}
.qr{display:flex;flex-wrap:wrap;gap:6px}
.qr button{border:1.5px solid var(--brand);background:#fff;color:var(--brand);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:500}
.qr button:hover{background:var(--tint)}

/* launcher */
.launch{max-width:980px;margin:0 auto;padding:32px 32px 64px;display:flex;flex-direction:column;gap:24px}
.launch h1{margin:0;font-size:26px;font-weight:500}
.launch p{margin:0;color:var(--ink2);max-width:70ch}
.lt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lt th,.lt td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.lt th{background:#f7f8fa;font-weight:500;color:var(--ink2);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.lt tr:last-child td{border-bottom:0}
.lt code{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:12px}
.lt .acts{display:flex;gap:6px;flex-wrap:wrap}
.lt button{border:1.5px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:500}
.lt button:hover{background:var(--tint)}
.scen{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scen div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}

function assignBags(){const sorted=S.cards.slice().sort(sortFns.rec),n=sorted.length,k=Math.round(n*0.2),r=rng(hash(S.route.o+S.route.d+S.v+'bag')),pos=[6];let guard=0;
  while(pos.length<k&&guard++<500){const i=6+Math.floor(r()*(n-6));if(!pos.includes(i)&&!pos.includes(i-1)&&!pos.includes(i+1))pos.push(i)}
  const ids=new Set(pos.map(i=>sorted[i].id));S.cards.forEach(c=>{c.chk=ids.has(c.id)})}
function markSwap(){
  const h=hash(S.route.o+S.route.d+S.v+S.c),done=[];
  const rank=o=>S.cards.slice().sort(sortFns.rec).findIndex(c=>c.ida[0]===o);
  const target=S.cards.length>=11?3:2;
  const cands=S.cards.slice().sort(sortFns.rec).slice(7).map(c=>c.ida[0]);
  for(const o of cands){
    if(done.length>=target)break;
    const pr=SWP[(h+done.length)%SWP.length],bak={stops:o.stops,via:o.via,dur:o.dur};
    o.stops=1;o.via=pr[0];o.swap={a:pr[0],b:pr[1]};o.swapWait=190+(h+done.length*13)%60;o.dur=Math.max(o.dur,300+(h+done.length*7)%40);
    if([...done,o].every(x=>rank(x)>=7))done.push(o);
    else{Object.assign(o,bak);delete o.swap}
  }
  /* troca de aeroporto também em linhas que não são a primeira (ida 2ª/3ª e volta) */
  const sorted=S.cards.slice().sort(sortFns.rec),rk=c=>S.cards.slice().sort(sortFns.rec).indexOf(c);let n=0;
  const pool2=sorted.slice(7),mk=c=>[...c.ida,...c.vol].some(x=>x.swap);
  for(const c of [...pool2.filter(c=>!mk(c)),...pool2.filter(mk)]){
    if(n>=target)break;
    if([...c.ida,...c.vol].filter(x=>x.swap).length>=2)continue;
    const rows=[...c.ida.slice(1),...c.vol].filter(x=>!x.swap),o=rows[n===1?rows.length-1:Math.min(n,rows.length-1)];
    if(!o)continue;
    const pr=SWP[(h+3+n)%SWP.length],bak={stops:o.stops,via:o.via,dur:o.dur};
    o.stops=1;o.via=pr[0];o.swap={a:pr[0],b:pr[1]};o.swapWait=190+(h+n*17)%60;o.dur=Math.max(o.dur,300+(h+n*11)%40);
    if(rk(c)>=7)n++;else{Object.assign(o,bak);delete o.swap}
  }
}

const optOK=(o,leg,f=S.f)=>{

  const d=S.draft;

  if(d.o===d.d){toast('Origem e destino precisam ser diferentes.');return}
  if(!d.ida){toast('Escolha as datas da viagem.');return}
  if(d.trip==='rt'&&(!d.volta||dayDiff(d.volta,d.ida)<1)){toast('Escolha uma data de volta depois da ida.');return}
  S.pop=null;
  S.route={o:d.o,d:d.d};S.dates={ida:d.ida,volta:d.trip==='rt'?d.volta:d.ida};S.pax={adt:d.adt,chd:d.chd,cls:d.cls};S.trip=d.trip;S.base={...S.dates};
  S.searchOpen=false;S.panel=S.v==='orig'?'air':null;S.sort='rec';S.mode='group';S.view='results';
  S.fclosed={stops:true,bag:true,hr:true,dur:true,air:true};S.fav={};S.tm=0;

  S.loading=true;rAll();window.scrollTo(0,0);

function naHide(){clearTimeout(_naT);if(_naEl){_naEl.remove();_naEl=null}}
function naShow(el,name,ev){
  naHide();
  const b=document.createElement('div');b.className='nabub';b.setAttribute('role','status');
  b.textContent=`Neste protótipo, "${name}" não está disponível.`;document.body.appendChild(b);_naEl=b;
  const r=el.getBoundingClientRect(),big=r.width>300||r.height>160,vw=document.documentElement.clientWidth;
  const cx=big?ev.clientX:r.left+r.width/2,top=big?ev.clientY:r.bottom;
  const w=b.offsetWidth,h=b.offsetHeight;
  let x=Math.max(8,Math.min(vw-w-8,cx-w/2)),y=top+12,up=false;
  if(y+h>innerHeight-8){y=(big?ev.clientY:r.top)-h-12;up=true}
  b.style.left=x+'px';b.style.top=Math.max(8,y)+'px';
  b.style.setProperty('--ax',Math.max(14,Math.min(w-14,cx-x))+'px');b.classList.add(up?'up':'dn');
  requestAnimationFrame(()=>b.classList.add('on'));
  _naT=setTimeout(naHide,2800)}

function markSwapTop(){
  const R=()=>S.cards.slice().sort(sortFns.rec),c=R()[2];if(!c)return;
  const h=hash(S.route.o+S.route.d+'top'),bad=[S.route.o,S.route.d];
  const prs=SWP.filter(p=>!bad.includes(p[0])&&!bad.includes(p[1]));if(!prs.length)return;
  const tryMark=(o,k,force)=>{
    if(o.swap)return false;
    const pr=prs[(h+k)%prs.length],bak={stops:o.stops,via:o.via,dur:o.dur};
    o.stops=1;o.via=pr[0];o.swap={a:pr[0],b:pr[1]};o.swapWait=190+(h+k*13)%60;o.dur=Math.max(o.dur,300+(h+k*7)%40);
    if(force||R()[2]===c)return true;
    Object.assign(o,bak);delete o.swap;delete o.swapWait;return false};
  const ord=a=>[...a.slice(1),...a.slice(0,1)];
  let n=0;
  for(const o of ord(c.ida)){if(tryMark(o,0)){n++;break}}
  if(c.vol.length){for(const o of ord(c.vol)){if(tryMark(o,1)){n++;break}}}
  if(!n)tryMark(c.ida[c.ida.length-1],0,true);
}
